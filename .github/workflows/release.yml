# Tag vX.Y.Z → GitHub release with Linux binaries + a Docker image on GHCR.
# Seeds run on servers, so Linux x64/arm64 covers the realistic fleet; other
# platforms can be added on request (or built from source anywhere Rust runs).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: mstream-discovery-seed-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            artifact: mstream-discovery-seed-linux-arm64
            use_cross: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.cargo/bin"
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Stage
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/mstream-discovery-seed" "staging/${{ matrix.artifact }}"
          chmod +x "staging/${{ matrix.artifact }}"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/${{ matrix.artifact }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/irosthebeggar/mstream-discovery-seed:latest
            ghcr.io/irosthebeggar/mstream-discovery-seed:${{ github.ref_name }}
